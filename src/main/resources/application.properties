spring.application.name=acquitance-backend
server.port=9090
server.address=0.0.0.0

# PostgreSQL Configuration
# These are intentionally required (${VAR} with no :default) so the app
# fails fast on startup instead of silently running with the wrong database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudinary - required, no defaults
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# CORS - required, no defaults. Comma-separated list of allowed origins,
# e.g. http://localhost:5173,https://jrmsu-sc-atvs.pages.dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Session cookie management
# Through a proxy (Cloudflare -> Render), SameSite=Lax is sufficient and safer.
# Secure=true is still required as both ends are HTTPS in production.
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=true
